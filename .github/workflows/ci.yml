name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (editable) with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install + lint + test + build frontend
        working-directory: dashboard/frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Build host (frontend already built)
        working-directory: dashboard/host
        run: dotnet build -c Release -p:SkipFrontend=true

      - name: Test host (settings read/write roundtrip)
        working-directory: dashboard/host.tests
        run: dotnet test -c Release -p:SkipFrontend=true
